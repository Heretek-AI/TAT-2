name: sonar

# Path A: SonarCloud scans the analyzable surface (Python/Shell/C#/YAML in
# tools/, .github/ and the tracked configs) on push/PR, and a non-Sonar ratchet
# job pins the GDScript gate numbers that Sonar cannot see. See
# docs/reports/w7g-gates.md §4 and docs/reports/w6t-graybox-sonar.md.
#
# One-time manual prerequisites (SonarCloud/GitHub settings; this workflow
# cannot turn them on):
#   1. SonarCloud -> project Heretek-AI_TAT-2 -> Administration -> Analysis
#      Method: turn OFF Automatic Analysis. Autoscan and this CI scan conflict
#      and autoscan ignores .sonar-project.properties.
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions: add
#      SONAR_TOKEN = a SonarCloud *project analysis token* for this project.
#   3. SonarCloud -> Quality Gates: bind "TAT-2 New Code" to the project. The
#      gate judges NEW code only, on three conditions: Reliability rating A,
#      Security rating A, duplication on new code <= 3 %. Coverage and
#      Maintainability are deliberately not gate conditions (there is no
#      coverage report and GDScript is invisible to Sonar).
#   4. Administration -> New Code: period = "Previous version" (or 30 days).
#   5. Keep every action pinned to a commit SHA (see the `uses:` lines below);
#      bump the SHA and its version comment together.
#   6. .sonar-project.properties lists .github in sonar.sources so workflow
#      changes are analyzed, not silently ignored.
# Without the secret (e.g. fork PRs) the scan step is skipped, not failed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Detect SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud (fork or fork-like PR)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # SonarSource/sonarqube-scan-action v5 (pinned commit, not a moving tag)
      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  gdscript-ratchet:
    name: GDScript ratchet (non-Sonar)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Hosted tooling checks
        run: |
          python3 -m py_compile tools/*.py
          python3 tools/check_content_overrides.py --table-only
          python3 tools/check_gate_ratchet.py
      - name: Explain the local-only gates
        run: |
          echo "The Godot gates need the private extract (extracted/, game/assets/),"
          echo "which is not in git, so they run locally, not on hosted runners:"
          echo ""
          echo "  make test"
          echo "  tools/godot --headless --path game --script \"\$PWD/tools/check_scripts_compile.gd\""
          echo "  tools/godot --headless --path game --script res://tests/test_m2_player.gd"
          echo "  tools/godot --headless --path game --script res://tests/e2e/run_e2e_tests.gd"
          echo "  make audit"
          echo ""
          echo "tools/gate_ratchet.json holds the measured floors (W7G, 74a43b8):"
          echo "compile 110/0, run_tests 263/0, M2 11/0, E2E 264/264."
          echo "Committed evidence: docs/reports/logs/w7g-*.log."
          echo "Update the ratchet only from a real gate log."
