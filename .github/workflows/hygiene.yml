name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    uses: Heretek-AI/.github/.github/workflows/hygiene.yml@c45e3e9db1ed261a6d470c923c949d81f92e598d # c45e3e9
    with:
      audit_workflows: true
      # Recorded evidence keeps its original capture paths byte-for-byte; the
