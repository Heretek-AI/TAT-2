# SonarCloud configuration for the Heretek-AI/TAT-2 project.
#
#   project:  https://sonarcloud.io/project/overview?id=Heretek-AI_TAT-2
#   org:      heretek-ai
#
# This file is the only Sonar configuration in the repo. It contains no
# credentials: the analysis token comes from SONAR_TOKEN (environment) or the
# Sonar CLI's own stored configuration, never from here.
#
# NOTE ON THE CLI: the Sonar CLI installed on the dev machine is authenticated
# against the organization `heretek-ai-1`, not `heretek-ai`, so `sonar list
# issues` / `sonar analyze` address the wrong organization and fail. That is a
# machine-local CLI setting, not a repository setting; switching it is a manual
# step (see docs/reports/w5f-sonar-p0.md).
#
# LANGUAGE SCOPE:
#   Analyzed:  Python (tools/, tests), C# (tools/tat-extract), Shell
#              (tools/*.sh, Makefile), and Godot's text formats (.tscn/.cfg)
#              only incidentally.
#   NOT analyzed: GDScript (.gd). SonarCloud has no GDScript analyzer, so the
#              whole game/ runtime -- the largest part of the codebase -- is
#              invisible to Sonar. Do not read the issue count as game-code
#              quality. GDScript correctness is covered by game/tests/ and the
#              E2E suites (see docs/HANDOFF_NEXT_AGENT.md).

sonar.projectKey=Heretek-AI_TAT-2
sonar.organization=heretek-ai
sonar.projectName=TAT-2
sonar.sourceEncoding=UTF-8

# Only the hand-written, redistributable code is scanned.
sonar.sources=tools,game

# Private / derived content that must never be uploaded for analysis, plus
# build outputs inside the scanned trees (CUE4Parse restore, ue4ss cache) and
# Godot's own sidecars.
sonar.exclusions=docs/reference/**,extracted/**,game/assets/**,game/.godot/**,build/**,game/data/generated/**,game/i18n/generated/**,game/scenes/review/**,**/__pycache__/**,tools/**/bin/**,tools/**/obj/**,tools/ue4ss/cache/**,tools/ue4ss/output/**,**/*.uid,**/*.import,**/*.log

# CUE4Parse pulls in vendored code we do not own; it is restored to tools/obj,
# which is git-ignored and outside sonar.sources.

# Coverage is not uploaded yet (no coverage report is produced or gated on).
# When it is, point this at the generated file and add the CI step described in
# docs/reports/w5f-sonar-p0.md:
# sonar.python.coverage.reportPaths=build/coverage/coverage.xml
