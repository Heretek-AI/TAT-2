# SonarCloud configuration for the Heretek-AI/TAT-2 project.
#
#   project:  https://sonarcloud.io/project/overview?id=Heretek-AI_TAT-2
#   org:      heretek-ai
#
# The scan itself runs in .github/workflows/sonar.yml. This file is the only
# Sonar configuration in the repo and contains no credentials: the token comes
# from the SONAR_TOKEN repository secret. Manual binding steps and the gate
# definition are in docs/reports/w7g-gates.md §4.
#
# LANGUAGE SCOPE (why this is not the game-quality gate):
#   Analyzed:  Python (tools/, tests, build/qa sources), Shell (tools/*.sh),
#              C# (tools/tat-extract), plus Godot's text formats incidentally.
#   NOT analyzed: GDScript (.gd). SonarCloud has no GDScript analyzer, so the
#              game/ runtime -- player, loader, AI, missions, UI -- is invisible
#              to Sonar. Do not read the Sonar issue count as game quality.
#              GDScript is gated by tools/gate_ratchet.json +
#              game/tests/run_tests.gd, test_m2_player.gd and the E2E tiers
#              (the non-Sonar job in sonar.yml).

sonar.projectKey=Heretek-AI_TAT-2
sonar.organization=heretek-ai
sonar.projectName=TAT-2
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Only hand-written, redistributable code. `game` contributes almost nothing
# analyzable (GDScript), but its tracked .cfg/.tscn text is kept in scope so the
# scan does not silently ignore the project definition. W7G: .github is in
# scope so workflow/policy changes are analyzed too (YAML/Shell).
sonar.sources=tools,game,.github

# Privacy + derived trees. extracted/, game/assets/, game/data/generated/,
# game/i18n/generated/ and game/.godot/ must never be uploaded; build/ is
# output; docs/ is prose and docs/reference/ is third-party reference material.
# The rest is build noise inside the scanned trees (CUE4Parse restore, ue4ss
# cache) and Godot sidecars.
sonar.exclusions=docs/**,extracted/**,game/assets/**,game/.godot/**,build/**,game/data/generated/**,game/i18n/generated/**,game/scenes/review/**,**/__pycache__/**,tools/**/bin/**,tools/**/obj/**,tools/ue4ss/cache/**,tools/ue4ss/output/**,**/*.uid,**/*.import,**/*.log,**/*.png,**/*.jpg,**/*.wav,**/*.ogg,**/*.glb,**/*.scn,**/*.res

# Duplication and coverage noise: vendored CUE4Parse restore output. There is
# no coverage report, so coverage stays excluded and is NOT a gate condition.
# The "TAT-2 New Code" gate judges three things only: new-code Reliability
# rating A, Security rating A and duplication on new code <= 3 %.
sonar.cpd.exclusions=tools/**/bin/**,tools/**/obj/**,tools/ue4ss/**
sonar.coverage.exclusions=**

# The quality gate is bound to "TAT-2 New Code" in the SonarCloud UI (see
# docs/reports/w7g-gates.md §4). Wait for it so a PR shows red instead of
# merging on a pending scan; give a cold project 10 minutes.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
